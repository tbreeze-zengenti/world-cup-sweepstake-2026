<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f3a" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2255%22 font-size=%2280%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>🏆</text></svg>" />
    <script>
      // set theme before first paint to avoid a flash of the wrong mode
      ;(function () {
        var root = document.documentElement
        var stored = localStorage.getItem('theme')
        var custom = null
        try {
          var themes = JSON.parse(localStorage.getItem('custom-themes') || '[]')
          for (var i = 0; i < themes.length; i++) {
            if (themes[i] && themes[i].id === stored) custom = themes[i]
          }
        } catch (e) {}
        root.dataset.theme = custom
          ? custom.base
          : stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        if (custom && custom.colors) {
          for (var token in custom.colors) root.style.setProperty('--' + token, custom.colors[token])
        }
      })()
    </script>
    <title>World Cup 2026 Sweepstake</title>
    <meta name="description" content="Zengenti World Cup 2026 sweepstake tracker — groups, knockout bracket and prize pots." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
