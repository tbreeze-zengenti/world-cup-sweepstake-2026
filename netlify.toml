[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Service workers must never be cached long — a stale sw.js delays updates
# to push handling for every subscriber.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Netlify defaults .webmanifest to application/octet-stream; iOS/Safari are
# pickier about the manifest MIME than Chrome.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Shadow the static dist/matches.json with the merged live data (force is
# required so the redirect wins over the file that exists in dist/). The
# function falls back to the same static data when no overlay exists.
[[redirects]]
  from = "/matches.json"
  to = "/.netlify/functions/matches"
  status = 200
  force = true

# SPA fallback — must be last; serves index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
